name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    api-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Start application in Docker
              run: docker run -p 3000:3000 -d --name gad-app jaktestowac/gad

            - name: Wait for app to be ready
              run: curl --retry 20 --retry-delay 3 --retry-all-errors http://localhost:3000

            - name: Run API tests
              run: npm run test:api

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-api
                  path: playwright-report/

            - name: Stop Docker services
              if: always()
              run: docker stop gad-app && docker rm gad-app
